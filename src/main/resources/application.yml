spring:
  application:
    name: todo-api
  datasource:
    url: jdbc:postgresql://localhost:5432/todo_api
    username: todo_user
    password: todo_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:troque-este-secret-em-producao-min-32-chars}
  expiration: 86400000 # 24h em milissegundos

springdoc:
  swagger-ui:
    path: /swagger-ui.html