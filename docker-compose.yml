services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-api-db
    environment:
      POSTGRES_DB: todo_api
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    ports:
      - "5432:5432"
    volumes:
      - todo_data:/var/lib/postgresql/data

volumes:
  todo_data: